---
title: CSV Browser
tagline: Fetch a CSV and search every field
description: Loads a CSV from a URL into a table. The file must be 6 MB or smaller, with at most 5,000 rows and 30 columns. The host has to allow cross-origin requests.
layout: default
---

<form id="fetch-form">
  <label class="mdc-text-field mdc-text-field--outlined mdc-text-field--no-label">
    <span class="mdc-notched-outline">
      <span class="mdc-notched-outline__leading"></span>
      <span class="mdc-notched-outline__trailing"></span>
    </span>
    <input id="csv-url" class="mdc-text-field__input" type="text" inputmode="url" autocomplete="off" spellcheck="false" aria-label="CSV URL" placeholder="https://example.com/file.csv">
  </label>
  <button id="fetch" class="mdc-button mdc-button--raised" type="submit">
    <div class="mdc-button__ripple" aria-hidden="true"></div>
    <span class="mdc-button__label">Fetch</span>
  </button>
</form>

<div class="mdc-form-field">
  <div class="mdc-checkbox">
    <input type="checkbox" class="mdc-checkbox__native-control" id="header-row" checked>
    <div class="mdc-checkbox__background">
      <svg class="mdc-checkbox__checkmark" viewBox="0 0 24 24">
        <path class="mdc-checkbox__checkmark-path" fill="none" d="M1.73,12.91 8.1,19.28 22.79,4.59"/>
      </svg>
      <div class="mdc-checkbox__mixedmark"></div>
    </div>
    <div class="mdc-checkbox__ripple"></div>
  </div>
  <label for="header-row">First row is a header</label>
</div>

<p id="status" role="status"></p>
<p id="error" role="alert" hidden></p>

<div id="results" hidden>
  <label class="mdc-text-field mdc-text-field--outlined mdc-text-field--no-label">
    <span class="mdc-notched-outline">
      <span class="mdc-notched-outline__leading"></span>
      <span class="mdc-notched-outline__trailing"></span>
    </span>
    <input id="row-search" class="mdc-text-field__input" type="text" autocomplete="off" aria-label="Search all fields" placeholder="Search all fields">
  </label>
  <p id="match-count" aria-live="polite"></p>
  <div class="mdc-data-table">
    <div class="mdc-data-table__table-container">
      <table class="mdc-data-table__table" aria-label="CSV">
        <thead>
          <tr class="mdc-data-table__header-row"></tr>
        </thead>
        <tbody class="mdc-data-table__content"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="/csv-browser/papaparse.min.js"></script>
