---
title: AI Footer
tagline: Wrap text in a collapsible original-comment footer
description: Hides the input in one of GitHub's <a href="https://docs.github.com/en/get-started/writing-on-github/working-with-advanced-formatting/organizing-information-with-collapsed-sections">collapsible sections</a>. So you can include the original AI message that prompted a PR review comment without bloating the UI with a long slop message.
layout: default
---
<label class="mdc-text-field mdc-text-field--outlined mdc-text-field--textarea mdc-text-field--no-label">
  <span class="mdc-notched-outline">
    <span class="mdc-notched-outline__leading"></span>
    <span class="mdc-notched-outline__trailing"></span>
  </span>
  <span class="mdc-text-field__resizer">
    <textarea id="input-text" class="mdc-text-field__input" aria-label="Paste original AI comment"></textarea>
  </span>
</label>

<pre id="output-text"></pre>
